# Local Postgres for development and tests.
# Host port 5434 avoids clashing with a Postgres already installed on 5432.
# Postgres 17 matches the version Neon runs in production.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: survey
      POSTGRES_PASSWORD: survey
      POSTGRES_DB: survey
    ports:
      - "5434:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      # Runs once on first start: creates the separate database the test suite uses.
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U survey -d survey"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  db-data:
